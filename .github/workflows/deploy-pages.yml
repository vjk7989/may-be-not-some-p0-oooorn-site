name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm ci
      - name: Validate source contract
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run test:contract
      - name: Format check
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run format:check
      - name: Build test site
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run build
      - name: Validate generated output
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run test:output
      - name: Smoke test generated routes
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run test:smoke
      - name: Install Chromium
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npx playwright install --with-deps chromium
      - name: Browser regression
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run test:e2e
      - name: Build Pages artifact
        shell: pwsh
        env:
          SITE_URL: https://vjk7989.github.io
          BASE_PATH: /may-be-not-some-p0-oooorn-site/
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run build
      - name: Validate Pages output
        shell: pwsh
        env:
          SITE_URL: https://vjk7989.github.io
          BASE_PATH: /may-be-not-some-p0-oooorn-site/
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run test:output
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
