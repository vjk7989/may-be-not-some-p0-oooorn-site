name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        shell: pwsh
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm ci
      - name: Build static site
        shell: pwsh
        env:
          SITE_URL: https://vjk7989.github.io/may-be-not-some-p0-oooorn-site
          NEXT_PUBLIC_BASE_PATH: /may-be-not-some-p0-oooorn-site
        run: ./scripts/Invoke-WorkspaceNodeTool.ps1 npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
